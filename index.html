<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ร้านของฉัน</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:"Noto Sans Thai",system-ui,sans-serif;color:#1f1f1f;background:#fff;font-size:15px;line-height:1.6}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit}

  /* ---------- หัวเว็บ ---------- */
  .topbar{height:72px;padding:0 64px;border-bottom:0.5px solid #e4e4e0;display:flex;align-items:center;justify-content:space-between;gap:24px;position:sticky;top:0;background:#fff;z-index:10}
  .brand{font-size:20px;font-weight:500}
  .nav{display:flex;gap:32px;font-size:15px;color:#5f5e5a}
  .nav a:hover{color:#1f1f1f}
  .admin-link{font-size:14px;color:#5f5e5a}

  /* ---------- เนื้อหา ---------- */
  .wrap{padding:32px 64px;max-width:1280px;margin:0 auto}
  .narrow{max-width:620px}
  .crumb{font-size:14px;color:#5f5e5a;margin-bottom:24px}
  .section-title{font-size:20px;font-weight:500;margin:0 0 20px}
  .muted{color:#5f5e5a;font-size:14px}
  .err{color:#a32d2d;font-size:14px;margin:0 0 12px}

  /* ---------- การ์ดสินค้า ---------- */
  .pills{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px}
  .pill{font-size:14px;padding:6px 14px;border:0.5px solid #b4b2a9;border-radius:999px;color:#1f1f1f}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:24px}
  .pcard{display:block}
  .thumb{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:#f1efe8;display:flex;align-items:center;justify-content:center;color:#5f5e5a;font-size:14px}
  img.thumb{display:block}
  .pname{font-size:15px;margin-top:10px;min-height:46px}
  .price{font-size:16px;font-weight:500;color:#993c1d}
  .old{font-size:13px;color:#888780;text-decoration:line-through;margin-left:8px}
  .badge{font-size:12px;background:#faece7;color:#712b13;padding:2px 8px;border-radius:8px;margin-left:8px}
  .stock{display:inline-block;font-size:13px;color:#27500a;background:#eaf3de;padding:3px 10px;border-radius:8px;margin-top:6px}
  .stock.out{color:#791f1f;background:#fcebeb}

  /* ---------- หน้าสินค้า ---------- */
  .detail{display:flex;gap:64px;align-items:flex-start;flex-wrap:wrap}
  .detail-img{width:560px;max-width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:#f1efe8}
  .info{flex:1;min-width:300px;display:flex;flex-direction:column;gap:18px}
  .info h1{margin:0;font-size:32px;font-weight:500;line-height:1.3}
  .price-row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .price-big{font-size:36px;font-weight:500;color:#993c1d}
  .price-old{font-size:18px;color:#888780;text-decoration:line-through}
  .btns{display:flex;flex-direction:column;gap:12px;margin-top:8px}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:8px;font-size:16px;font-weight:500;border:0;cursor:pointer;width:100%;color:#fff;background:#1f1f1f;text-align:center}
  .btn:hover{opacity:.92}
  .btn[disabled]{background:#c9c8c1;cursor:not-allowed}
  .btn.shopee{background:#EE4D2D}
  .btn.tiktok{background:#000}
  .logo-slot{display:inline-block;width:0}
  .disclosure{margin:0;font-size:12px;color:#888780}
  .desc{border-top:0.5px solid #e4e4e0;padding-top:20px;font-size:15px;line-height:1.7;color:#444441;white-space:pre-line}

  /* ---------- ขั้นตอนสั่งซื้อ ---------- */
  .step{font-size:13px;color:#5f5e5a;margin-bottom:6px}
  .field-label{display:block;font-size:14px;font-weight:500;margin:18px 0 8px}
  .field input,.field textarea{width:100%;padding:12px 14px;border:0.5px solid #b4b2a9;border-radius:8px;font-size:15px;font-family:inherit;background:#fff;color:#1f1f1f}
  .field input:focus,.field textarea:focus{outline:1.5px solid #1f1f1f;border-color:transparent}
  .option{display:flex;gap:12px;align-items:flex-start;border:0.5px solid #b4b2a9;border-radius:8px;padding:14px;margin-top:10px;cursor:pointer}
  .option:has(input:checked){border:1.5px solid #1f1f1f}
  .option input{margin-top:4px}
  .option b{display:block;font-weight:500}
  .option span{font-size:13px;color:#5f5e5a}
  table{width:100%;border-collapse:collapse;margin-top:8px}
  td,th{border-bottom:0.5px solid #e4e4e0;padding:10px 4px;text-align:left;font-size:14px;vertical-align:top}
  th{font-weight:500}
  .right{text-align:right}
  .box{background:#f7f6f2;border-radius:8px;padding:16px;margin:20px 0;font-size:14px;line-height:1.8}
  .box strong{font-weight:500;color:#993c1d}
  .bank{white-space:pre-line;color:#5f5e5a;font-size:13px;margin-top:8px}
  .slip-preview{width:100%;max-height:260px;object-fit:contain;border-radius:8px;margin-top:12px;border:0.5px solid #e4e4e0}
  .back-link{display:inline-block;margin-top:20px;font-size:14px;color:#5f5e5a;text-decoration:underline}

  @media (max-width:820px){
    .topbar{padding:12px 20px;height:auto;flex-wrap:wrap}
    .nav{display:none}
    .wrap{padding:24px 20px}
    .detail-img{width:100%}
    .info h1{font-size:26px}
  }
.step-img{width:100%;max-width:360px;aspect-ratio:1/1;object-fit:cover;border-radius:12px;display:block;margin:0 0 16px;background:#f1efe8}
.step-img.thumb{display:flex;align-items:center;justify-content:center;color:#888780;font-size:14px}
.variants{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:8px}
.variant{display:flex;flex-direction:column;align-items:flex-start;gap:8px;border:0.5px solid #b4b2a9;border-radius:10px;padding:10px;cursor:pointer;background:#fff}
.variant input{margin:0}
.variant img,.vthumb{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px;background:#f1efe8;display:block}
.variant span{display:flex;flex-direction:column;font-size:14px}
.variant small{color:#27500a;font-size:12px}
.variant.off{opacity:.5;cursor:not-allowed}
.variant:has(input:checked){border:1.5px solid #1f1f1f}
.link-btn{background:none;border:0;padding:0;color:#993c1d;font-size:14px;cursor:pointer;font-family:inherit;text-decoration:underline}
.summary{border:0.5px solid #e4e4e0;border-radius:10px;padding:12px 14px;margin:16px 0}
.srow{display:flex;justify-content:space-between;padding:4px 0;font-size:15px}
.srow.disc{color:#27500a}
.srow.total{border-top:0.5px solid #e4e4e0;margin-top:6px;padding-top:8px;font-weight:500}
.srow.pay{color:#993c1d;font-weight:500}
.qty-row{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.qbtn{width:44px;height:44px;border:0.5px solid #b4b2a9;border-radius:8px;background:#fff;font-size:20px;cursor:pointer}
.qty-input{width:80px;height:44px;text-align:center;font-size:16px;border:0.5px solid #b4b2a9;border-radius:8px}
.vprice{color:#993c1d;font-size:14px}
.admin-card{border:0.5px solid #e4e4e0;border-radius:10px;padding:14px;margin:12px 0;display:flex;flex-direction:column;gap:6px}
.admin-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px}
.admin-actions .trk{height:40px;padding:0 10px;border:0.5px solid #b4b2a9;border-radius:8px;font-size:14px;width:180px}
.btn-sm{width:auto;height:40px;padding:0 14px;font-size:14px}
.btn-ghost{background:#fff;color:#1f1f1f;border:0.5px solid #b4b2a9}
.notice{background:#faece7;color:#712b13;border-radius:8px;padding:10px 14px;margin-bottom:12px}
.step-img{margin-left:auto;margin-right:auto}
.variant-wrap{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.variant-wrap .variants{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;width:100%;margin-bottom:0}
.variant-wrap.slider .variants{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;gap:10px;scroll-behavior:smooth;min-width:0;flex:1}
.variant-wrap.slider .variants::-webkit-scrollbar{display:none}
.variant-wrap.slider .variant{flex:0 0 150px;scroll-snap-align:start}
.vnav{flex:0 0 36px;height:36px;border-radius:50%;border:0.5px solid #b4b2a9;background:#fff;font-size:20px;cursor:pointer;line-height:1;padding:0}
.step-img{max-width:none;width:100vw;max-height:80vh;aspect-ratio:auto;height:auto;border-radius:0;margin:0 calc(50% - 50vw) 16px;object-fit:cover}
.step-img.thumb{height:min(100vw,80vh);aspect-ratio:auto}
#stockLabel{display:block;text-align:center}
.qty-row{justify-content:center}
.warn{background:#faeeda;color:#633806;border-radius:8px;padding:10px 14px;margin:12px 0;font-size:14px;line-height:1.6}
.qty-input::-webkit-inner-spin-button,.qty-input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.qty-input{-moz-appearance:textfield;appearance:textfield}
.paylist{border:0.5px solid #e4e4e0;border-radius:12px;overflow:hidden;margin:8px 0 16px}
.payrow{display:flex;align-items:center;gap:12px;padding:16px;cursor:pointer;border-top:0.5px solid #e4e4e0}
.paylist .payrow:first-child{border-top:0}
.payrow .ptxt{display:flex;flex-direction:column;flex:1;font-size:15px}
.payrow .ptxt small{color:#5f5e5a;font-size:13px}
.payrow input[type=radio]{width:22px;height:22px;margin:0;accent-color:#1f1f1f;flex:0 0 auto}
.pico{flex:0 0 40px;height:40px;border-radius:8px;background:#f1efe8;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:16px;color:#1f1f1f}
.pico.cod{background:#faece7;color:#993c1d;font-size:13px}
.paylist .codwarn{margin:0 16px 16px;border-radius:8px}
</style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="#/">ร้านของฉัน</a>
  <nav class="nav">
    <a href="#/">หน้าแรก</a>
    <a href="#/">สินค้าทั้งหมด</a>
    <a href="#/">โปรโมชัน</a>
    <a href="#/">ติดต่อเรา</a>
  </nav>
  <a class="admin-link" href="admin.html">หลังบ้าน</a>
</header>

<div id="app"></div>

<script>
/*
 * หน้าร้าน (เวอร์ชันตัวอย่าง): ข้อมูลเก็บในเบราว์เซอร์นี้เท่านั้น
 * ลิงก์ Shopee / TikTok ในข้อมูลตัวอย่างเป็นค่าว่าง จึงยังไม่แสดงปุ่ม ให้ใส่ลิงก์พันธมิตรจริงในหลังบ้าน
 */
const KEY = 'shop-front-v4';
/* รูปตัวอย่างแบบวาดง่ายๆ ใช้แทนรูปจริงจนกว่าจะอัปโหลดจากหลังบ้าน */
function sampleBag(color) {
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><rect width="400" height="400" fill="#f1efe8"/><path d="M150 150 C150 80 250 80 250 150" fill="none" stroke="#5f5e5a" stroke-width="12"/><rect x="100" y="150" width="200" height="180" rx="10" fill="' + color + '"/></svg>';
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
const SHIPPING_DEFAULT = 40;
const HOSTS = {
  shopee: ['shopee.co.th', 's.shopee.co.th', 'shope.ee'],
  tiktok: ['tiktok.com', 'vt.tiktok.com', 'shop.tiktok.com'],
};
const CHANNEL_LABEL = { shopee: 'Shopee', tiktok: 'TikTok' };

let data = load();
let draft = (() => { try { return JSON.parse(sessionStorage.getItem('shop-draft-v1')) || null; } catch { return null; } })();
function setDraft(d) {
  draft = d;
  try { if (d) sessionStorage.setItem('shop-draft-v1', JSON.stringify(d)); else sessionStorage.removeItem('shop-draft-v1'); } catch {}
}

const $app = () => document.getElementById('app');
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const baht = (n) => '฿' + Number(n).toLocaleString('th-TH');
const nowBkk = () => new Date(Date.now() + 7 * 3600e3).toISOString().slice(0, 16);

function seed() {
  return {
    bank: 'ธนาคารตัวอย่าง เลขที่บัญชี 000-0-00000-0 ชื่อบัญชี ร้านของฉัน',
    categories: [
      { id: 1, name: 'เสื้อผ้า', slug: 'clothes' },
      { id: 2, name: 'ขนม', slug: 'snacks' },
      { id: 3, name: 'น้ำหอม', slug: 'perfume' },
    ],
    products: [
      { id: 1, name: 'กระเป๋าผ้าแคนวาส รุ่นมินิมอล', slug: 'canvas-bag', categoryId: 1, description: 'กระเป๋าผ้าแคนวาสน้ำหนักเบา ใส่ได้ทั้งของใช้ประจำวันและโน้ตบุ๊กขนาด 13 นิ้ว มีซิปปิดด้านบนและกระเป๋าด้านในหนึ่งช่อง', price: 1290, shipping: SHIPPING_DEFAULT, onHand: 0, reserved: 0, image: sampleBag('#d8c9a8'), discount: { kind: 'fixed', value: 300 }, links: {}, variants: [
        { id: 'black', name: 'สีดำ', image: sampleBag('#2c2c2a'), price: 1290, onHand: 6, reserved: 0 },
        { id: 'brown', name: 'สีน้ำตาล', image: sampleBag('#8b5e3c'), price: 1290, onHand: 6, reserved: 0 },
        { id: 'white', name: 'สีขาว', image: sampleBag('#f5f5f0'), price: 1290, onHand: 6, reserved: 0 },
        { id: 'navy', name: 'สีกรมท่า', image: sampleBag('#1f3a5f'), price: 1290, onHand: 6, reserved: 0 },
        { id: 'green', name: 'สีเขียว', image: sampleBag('#3b6d11'), price: 1290, onHand: 6, reserved: 0 },
      ] },
      { id: 2, name: 'ขนมปังกรอบ รสนม', slug: 'milk-cracker', categoryId: 2, description: 'ขนาด 100 กรัม', price: 35, shipping: SHIPPING_DEFAULT, onHand: 50, reserved: 0, image: sampleBag('#e8c7a0'), discount: null, links: {} },
      { id: 3, name: 'น้ำหอมกลิ่นไม้ซีดาร์', slug: 'cedar-perfume', categoryId: 3, description: 'ขนาด 30 มล.', price: 450, shipping: SHIPPING_DEFAULT, onHand: 5, reserved: 0, image: sampleBag('#c9b8d9'), discount: null, links: {} },
    ],
    codFee: 0,
    orders: [],
    nextOrderId: 1,
  };
}
function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || seed(); } catch { return seed(); }
}
function save() { localStorage.setItem(KEY, JSON.stringify(data)); }

/* ---------- ราคาและสต๊อก ---------- */
function priceFor(p, vr) {
  const base = vr && vr.price != null ? vr.price : p.price;
  let price = base;
  const d = p.discount;
  if (d) {
    const x = d.kind === 'percent' ? Math.floor((base * (100 - d.value)) / 100) : Math.max(0, base - d.value);
    if (x < price) price = x;
  }
  const discounted = price < base;
  return { original: base, price, discounted, pct: discounted && base ? Math.round((1 - price / base) * 100) : 0 };
}
function priceOf(p) { return priceFor(p, null); }
/* ค่าจัดส่งเก็บเฉพาะเก็บเงินปลายทาง ถ้าโอนเต็มจำนวนจัดส่งฟรี */
function shippingFor(p, method) { return method === 'cod' ? p.shipping : 0; }
/* ค่า COD กำหนดในหลังบ้าน ลูกค้าชำระล่วงหน้าพร้อมค่าจัดส่ง */
function codFeeFor(method) { return method === 'cod' ? (data.codFee || 0) : 0; }
const variantAvail = (v) => Math.max(0, v.onHand - v.reserved);
const hasVariants = (p) => Array.isArray(p.variants) && p.variants.length > 0;
const available = (p) => hasVariants(p)
  ? p.variants.reduce((sum, v) => sum + variantAvail(v), 0)
  : Math.max(0, p.onHand - p.reserved);
const firstInStock = (p) => (p.variants || []).find((v) => variantAvail(v) > 0);
const catById = (id) => data.categories.find((c) => c.id === id);
const productBySlug = (slug) => data.products.find((p) => p.slug === slug);
function allowedLink(ch, raw) {
  let u;
  try { u = new URL(raw); } catch { return false; }
  if (u.protocol !== 'https:') return false;
  return HOSTS[ch].some((h) => u.hostname === h || u.hostname.endsWith('.' + h));
}
const extChannels = (p) => ['shopee', 'tiktok'].filter((ch) => !p.links[ch] || allowedLink(ch, p.links[ch]));

/* ---------- ชิ้นส่วนแสดงผล ---------- */
function priceHtml(p) {
  const pr = priceOf(p);
  if (!pr.discounted) return `<span class="price">${baht(pr.price)}</span>`;
  return `<span class="price">${baht(pr.price)}</span><span class="old">${baht(pr.original)}</span><span class="badge">ลด ${pr.pct}%</span>`;
}
const stockHtml = (p) => available(p) > 0
  ? `<span class="stock">คงเหลือในร้าน ${available(p)} ชิ้น</span>`
  : `<span class="stock out">สินค้าหมดในร้าน</span>`;
const thumb = (p) => p.image ? `<img class="thumb" src="${esc(p.image)}" alt="">` : `<div class="thumb">ยังไม่มีรูปสินค้า</div>`;
const stepLabel = (n) => `<div class="step">ขั้นตอนที่ ${n} จาก 3</div>`;

/* ---------- หน้าต่างๆ ---------- */
function pageHome() {
  const pills = data.categories.map((c) => `<a class="pill" href="#/c/${esc(c.slug)}">${esc(c.name)}</a>`).join('');
  return `<div class="wrap">
    <div class="pills">${pills}</div>
    <h2 class="section-title">สินค้าทั้งหมด</h2>
    ${grid(data.products)}
  </div>`;
}
function grid(list) {
  if (!list.length) return '<p class="muted">ยังไม่มีสินค้าให้แสดง</p>';
  return `<div class="grid">${list.map((p) => `<a class="pcard" href="#/p/${esc(p.slug)}">${thumb(p)}
    <div class="pname">${esc(p.name)}</div><div>${priceHtml(p)}</div>${stockHtml(p)}</a>`).join('')}</div>`;
}
function pageCategory(slug) {
  const cat = data.categories.find((c) => c.slug === slug);
  if (!cat) return pageNotFound();
  return `<div class="wrap">
    <div class="pills">${data.categories.map((c) => `<a class="pill" href="#/c/${esc(c.slug)}">${esc(c.name)}</a>`).join('')}</div>
    <h2 class="section-title">${esc(cat.name)}</h2>
    ${grid(data.products.filter((p) => p.categoryId === cat.id))}
  </div>`;
}
function pageProduct(slug) {
  const p = productBySlug(slug);
  if (!p) return pageNotFound();
  const pr = priceOf(p);
  const cat = catById(p.categoryId);
  const ext = extChannels(p);
  const storeBtn = available(p) > 0
    ? `<a class="btn" href="#/p/${esc(p.slug)}/checkout">สั่งซื้อสินค้าราคา ${baht(pr.price)}</a>`
    : `<button class="btn" disabled>สินค้าหมดในร้าน</button>`;
  const extBtns = ext.map((ch) => `<a class="btn ${ch}" href="${esc(p.links[ch] || '#')}" target="_blank" rel="sponsored nofollow noopener" onclick="trackClick(${p.id},'${ch}')"><span class="logo-slot"></span>สั่งซื้อผ่าน ${CHANNEL_LABEL[ch]}</a>`).join('');
  const disclosure = ext.length ? '<p class="disclosure">ปุ่ม Shopee และ TikTok เป็นลิงก์พันธมิตร ราคาและสต๊อกอาจต่างกันตามแพลตฟอร์ม</p>' : '';
  return `<div class="wrap">
    <div class="crumb">หน้าแรก${cat ? ' / ' + esc(cat.name) : ''} / ${esc(p.name)}</div>
    <div class="detail">
      ${p.image ? `<img class="detail-img" src="${esc(p.image)}" alt="">` : `<div class="detail-img thumb">รูปสินค้าจากหลังบ้าน</div>`}
      <div class="info">
        <div>
          <h1>${esc(p.name)}</h1>
          ${cat ? `<p class="muted" style="margin:8px 0 0">หมวด ${esc(cat.name)}</p>` : ''}
        </div>
        <div class="price-row">
          <span class="price-big">${baht(pr.price)}</span>
          ${pr.discounted ? `<span class="price-old">${baht(pr.original)}</span><span class="badge">ลด ${pr.pct}%</span>` : ''}
        </div>
        <div>${stockHtml(p)}</div>
        <div class="btns">
          ${storeBtn}
          ${extBtns}
          ${disclosure}
        </div>
        <div class="desc">${esc(p.description)}</div>
      </div>
    </div>
  </div>`;
}

/* ขั้นตอนที่ 2: เลือกตัวเลือกและจำนวนเท่านั้น */
function summaryFor(p, vr, qty, method) {
  const pr = priceFor(p, vr);
  const listTotal = pr.original * qty;
  const subtotal = pr.price * qty;
  const discount = listTotal - subtotal;
  const cod = method === 'cod';
  const shipping = method ? shippingFor(p, method) : 0;
  const codFee = codFeeFor(method);
  const total = subtotal + shipping + codFee;
  return { pr, listTotal, discount, subtotal, shipping, codFee, total, cod, dueNow: cod ? shipping + codFee : total, onDelivery: cod ? subtotal : 0 };
}
function summaryHtml(p, vr, qty, method) {
  const s = summaryFor(p, vr, qty, method);
  const payMode = method === 'transfer' || method === 'cod';
  return `<div class="summary">
    <div class="srow"><span>ราคาสินค้า ${qty} ชิ้น</span><span>${baht(s.listTotal)}</span></div>
    ${s.discount > 0 ? `<div class="srow disc"><span>ส่วนลด${s.pr.pct ? ' ' + s.pr.pct + '%' : ''}</span><span>-${baht(s.discount)}</span></div>` : ''}
    ${s.cod ? `<div class="srow"><span>ค่าจัดส่ง</span><span>${baht(s.shipping)}</span></div>` : ''}
    ${s.cod && s.codFee ? `<div class="srow"><span>ค่าบริการ COD</span><span>${baht(s.codFee)}</span></div>` : ''}
    <div class="srow total"><span>รวมทั้งสิ้น</span><span>${baht(s.total)}</span></div>
    ${payMode ? `<div class="srow pay"><span>${s.cod ? 'ชำระตอนนี้ (ค่าจัดส่ง)' : 'ชำระตอนนี้'}</span><span>${baht(s.dueNow)}</span></div>` : ''}
    ${payMode && s.cod ? `<div class="srow pay"><span>ชำระตอนรับของ (ค่าสินค้า)</span><span>${baht(s.onDelivery)}</span></div>` : ''}
  </div>`;
}
function checkoutState(slug) {
  const p = productBySlug(slug);
  const form = document.getElementById('checkoutForm');
  if (!p || !form) return null;
  const vid = form.elements.variant ? form.elements.variant.value : '';
  const vr = hasVariants(p) ? (p.variants.find((x) => x.id === vid) || null) : null;
  const limit = hasVariants(p) ? (vr ? variantAvail(vr) : 0) : available(p);
  return { p, vr, limit, form };
}
function refreshSummary(slug) {
  const st = checkoutState(slug);
  if (!st) return;
  const { p, vr, limit, form } = st;
  const input = form.elements.qty;
  let n = parseInt(input.value, 10) || 1;
  n = Math.max(1, Math.min(n, Math.min(50, limit) || 1));
  input.value = n;
  input.max = Math.min(50, limit);
  document.getElementById('stockLabel').textContent = `จำนวน (คงเหลือ ${limit} ชิ้น)`;
  document.getElementById('summary').innerHTML = summaryHtml(p, vr, n, null);
}
function stepQty(slug, delta) {
  const st = checkoutState(slug);
  if (!st || st.limit < 1) return;
  st.form.elements.qty.value = (parseInt(st.form.elements.qty.value, 10) || 1) + delta;
  refreshSummary(slug);
}
function pageCheckout(slug, d, error = '') {
  const p = productBySlug(slug);
  if (!p) return pageNotFound();
  if (available(p) < 1) { location.hash = '#/p/' + slug; return ''; }
  const v = d && d.slug === slug ? d : { qty: 1, variant: '' };
  const pick = hasVariants(p) ? (p.variants.find((x) => x.id === v.variant && variantAvail(x) > 0) || firstInStock(p)) : null;
  const limit = hasVariants(p) ? (pick ? variantAvail(pick) : 0) : available(p);
  const qty = Math.max(1, Math.min(v.qty || 1, limit || 1));
  const sp = esc(p.slug);
  const many = hasVariants(p) && p.variants.length > 2;
  const variantsHtml = hasVariants(p) ? `<label class="field-label">เลือกตัวเลือกสินค้า</label>
      <div class="variant-wrap${many ? ' slider' : ''}">
        <div class="variants" id="variantsRow">${p.variants.map((x) => {
          const n = variantAvail(x);
          return `<label class="variant ${n < 1 ? 'off' : ''}">
            <input type="radio" name="variant" value="${esc(x.id)}" onchange="refreshSummary('${sp}')" ${pick && pick.id === x.id ? 'checked' : ''} ${n < 1 ? 'disabled' : ''}>
            ${x.image ? `<img src="${esc(x.image)}" alt="">` : '<span class="vthumb"></span>'}
            <span><b>${esc(x.name)}</b><small class="vprice">${baht(priceFor(p, x).price)}</small><small>${n > 0 ? 'เหลือ ' + n + ' ชิ้น' : 'หมดแล้ว'}</small></span>
          </label>`;
        }).join('')}</div>
      </div>` : '';
  return `<div class="wrap narrow">
    ${p.image ? `<img class="step-img" src="${esc(p.image)}" alt="">` : '<div class="step-img thumb">รูปสินค้าจากหลังบ้าน</div>'}
    <h2 class="section-title" style="margin-bottom:12px">${esc(p.name)}</h2>
    ${error ? `<p class="err">${esc(error)}</p>` : ''}
    <form id="checkoutForm" onsubmit="goPay(event,'${sp}')">
      ${variantsHtml}
      <label class="field-label" id="stockLabel">จำนวน (คงเหลือ ${limit} ชิ้น)</label>
      <div class="qty-row">
        <button type="button" class="qbtn" onclick="stepQty('${sp}',-1)" aria-label="ลดจำนวน">−</button>
        <input class="qty-input" name="qty" type="number" min="1" max="${Math.min(50, limit)}" value="${qty}" oninput="refreshSummary('${sp}')" required>
        <button type="button" class="qbtn" onclick="stepQty('${sp}',1)" aria-label="เพิ่มจำนวน">+</button>
      </div>
      <div id="summary">${summaryHtml(p, pick, qty, null)}</div>
      <button class="btn" type="submit" style="margin-top:24px">สั่งซื้อสินค้า</button>
    </form>
  </div>`;
}

/* ขั้นตอนที่ 3: ชำระเงินและแนบสลิป */

      <div class="admin-actions"><input class="trk" id="codFeeInput" type="number" min="0" value="${data.codFee || 0}" style="width:120px"><button class="btn btn-sm" onclick="saveCodFee()">บันทึก</button></div></div>

/* ---------- การทำงานของฟอร์ม ---------- */
function saveCodFee() {
  const v = Math.max(0, Math.round(Number(document.getElementById('codFeeInput').value) || 0));
  data.codFee = v; save(); render();
}
function useMyLocation() {
  const st = document.getElementById('locStatus');
  const ta = document.querySelector('textarea[name="address"]');
  if (!navigator.geolocation) { st.textContent = 'เบราว์เซอร์นี้ไม่รองรับการใช้ตำแหน่ง กรุณาพิมพ์ที่อยู่เอง'; return; }
  st.textContent = 'กำลังหาตำแหน่ง...';
  navigator.geolocation.getCurrentPosition(async (pos) => {
    const lat = pos.coords.latitude.toFixed(6);
    const lon = pos.coords.longitude.toFixed(6);
    try {
      const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&accept-language=th&zoom=18&lat=${lat}&lon=${lon}`);
      const j = await r.json();
      ta.value = j.display_name || `พิกัด ${lat}, ${lon}`;
      st.textContent = 'กรอกที่อยู่จากตำแหน่งแล้ว กรุณาตรวจบ้านเลขและรายละเอียดก่อนกดสั่งซื้อ';
    } catch {
      ta.value = `พิกัด ${lat}, ${lon}`;
      st.textContent = 'ดึงชื่อที่อยู่ไม่ได้ กรุณาพิมพ์ที่อยู่เพิ่มเติม';
    }
  }, () => {
    st.textContent = 'ไม่ได้รับอนุญาตให้เข้าถึงตำแหน่ง กรุณาอนุญาตในเบราว์เซอร์หรือพิมพ์ที่อยู่เอง';
  }, { enableHighAccuracy: true, timeout: 15000 });
}
function goPay(e, slug) {
  e.preventDefault();
  const p = productBySlug(slug);
  const f = new FormData(e.target);
  const variant = String(f.get('variant') || '');
  const qty = parseInt(f.get('qty'), 10);
  const vr = p && hasVariants(p) ? p.variants.find((x) => x.id === variant) : null;
  const limit = p ? (hasVariants(p) ? (vr ? variantAvail(vr) : 0) : available(p)) : 0;
  let err = '';
  if (!p) err = 'ไม่พบสินค้า';
  else if (hasVariants(p) && !vr) err = 'กรุณาเลือกตัวเลือกสินค้า';
  else if (!(qty >= 1 && qty <= 50)) err = 'จำนวนต้องอยู่ระหว่าง 1 ถึง 50';
  else if (qty > limit) err = `สินค้าเหลือ ${limit} ชิ้น`;
  if (err) { $app().innerHTML = pageCheckout(slug, { slug, variant, qty }, err); return; }
  setDraft({ slug, variant, qty, method: 'transfer', slip: null });
  location.hash = `#/p/${slug}/pay`;
}

function refreshPay(slug) {
  const p = productBySlug(slug);
  const form = document.getElementById('payForm');
  if (!p || !form || !draft || draft.slug !== slug) return;
  const vr = hasVariants(p) ? p.variants.find((x) => x.id === draft.variant) : null;
  const method = form.elements.payment_method.value === 'cod' ? 'cod' : 'transfer';
  setDraft({ ...draft, method });
  document.getElementById('summary').innerHTML = summaryHtml(p, vr, draft.qty, method);
  document.getElementById('codWarn').style.display = method === 'cod' ? 'block' : 'none';
}

function previewSlip(input) {
  const img = document.getElementById('slipPreview');
  const file = input.files && input.files[0];
  if (!file) { img.style.display = 'none'; return; }
  img.src = URL.createObjectURL(file);
  img.style.display = 'block';
}

function readAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

async function submitPay(e, slug) {
  e.preventDefault();
  const p = productBySlug(slug);
  if (!p || !draft || draft.slug !== slug) return alert('ข้อมูลไม่ครบ กรุณาเริ่มสั่งซื้อใหม่');
  const form = e.target;
  const method = form.elements.payment_method.value === 'cod' ? 'cod' : 'transfer';
  const file = form.elements.slip.files[0];
  let slip = draft.slip;
  if (file) {
    if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) return alert('รองรับเฉพาะไฟล์ JPG, PNG และ WEBP');
    if (file.size > 2 * 1024 * 1024) return alert('ไฟล์สลิปต้องไม่เกิน 2 MB');
    slip = await readAsDataUrl(file);
  }
  if (!slip) return alert('กรุณาแนบสลิปการโอน');
  setDraft({ ...draft, method, slip });
  location.hash = `#/p/${slug}/address`;
}

function submitAddress(e, slug) {
  e.preventDefault();
  const p = productBySlug(slug);
  const f = new FormData(e.target);
  const d = {
    ...(draft || {}),
    name: String(f.get('customer_name') || '').trim(),
    phone: String(f.get('phone') || '').trim(),
    address: String(f.get('address') || '').trim(),
    note: String(f.get('note') || '').trim(),
  };
  const vr = p && hasVariants(p) ? p.variants.find((x) => x.id === d.variant) : null;
  const limit = !p ? 0 : hasVariants(p) ? (vr ? variantAvail(vr) : 0) : available(p);
  let err = '';
  if (!p || !draft || draft.slug !== slug) err = 'ข้อมูลไม่ครบ กรุณาเริ่มสั่งซื้อใหม่';
  else if (d.qty > limit) err = `สินค้าเหลือ ${limit} ชิ้น`;
  else if (!d.name) err = 'กรุณากรอกชื่อผู้รับ';
  else if (!/^[0-9+\-\s]{9,15}$/.test(d.phone)) err = 'กรุณากรอกเบอร์โทรที่ถูกต้อง';
  else if (d.address.length < 10) err = 'กรุณากรอกที่อยู่จัดส่งให้ครบ';
  if (err) { $app().innerHTML = pageAddress(slug, d, err); return; }

  const unit = priceFor(p, vr).price;
  const subtotal = unit * d.qty;
  const cod = d.method === 'cod';
  const shipping = shippingFor(p, d.method);
  const codFee = codFeeFor(d.method);
  const total = subtotal + shipping + codFee;
  if (vr) vr.reserved += d.qty; else p.reserved += d.qty;
  const order = {
    id: data.nextOrderId++,
    name: d.name, phone: d.phone, address: d.address, note: d.note,
    items: [{ productId: p.id, variantId: vr ? vr.id : null, name: vr ? `${p.name} (${vr.name})` : p.name, qty: d.qty, unitPrice: unit }],
    shipping,
    codFee,
    total,
    payment: d.method,
    dueNow: cod ? shipping + codFee : total,
    onDelivery: cod ? subtotal : 0,
    slip: d.slip,
    status: 'pending',
    tracking: '',
    createdAt: nowBkk(),
  };
  data.orders.unshift(order);
  try {
    save();
  } catch {
    if (vr) vr.reserved -= d.qty; else p.reserved -= d.qty;
    data.orders.shift();
    data.nextOrderId--;
    return alert('บันทึกไม่สำเร็จ สลิปอาจใหญ่เกินพื้นที่ของเบราว์เซอร์ ลองใช้ไฟล์ที่เล็กลง');
  }
  setDraft(null);
  location.hash = '#/order/' + order.id;
}

/* หลังบ้าน: การกระทำของ Admin */
function adminFind(id) { return data.orders.find((x) => x.id === id); }
function adminConfirm(id) {
  const o = adminFind(id); if (!o) return;
  o.status = 'paid'; save(); render();
}
function adminShip(id) {
  const o = adminFind(id); if (!o) return;
  const t = (document.getElementById('trk' + id).value || '').trim();
  if (!t) return alert('กรุณาใส่เลขพัสดุก่อน');
  o.items.forEach((i) => {
    const p = data.products.find((x) => x.id === i.productId);
    if (!p) return;
    const vr = hasVariants(p) ? p.variants.find((x) => x.id === i.variantId) : null;
    if (vr) { vr.onHand -= i.qty; vr.reserved -= i.qty; }
    else { p.onHand -= i.qty; p.reserved -= i.qty; }
  });
  o.tracking = t; o.status = 'shipped'; save(); render();
}
function adminCancel(id) {
  const o = adminFind(id); if (!o) return;
  if (!confirm('ยกเลิกคำสั่งซื้อนี้และคืนสต๊อก?')) return;
  o.items.forEach((i) => {
    const p = data.products.find((x) => x.id === i.productId);
    if (!p) return;
    const vr = hasVariants(p) ? p.variants.find((x) => x.id === i.variantId) : null;
    if (vr) vr.reserved -= i.qty; else p.reserved -= i.qty;
  });
  o.status = 'cancelled'; save(); render();
}

function trackClick(id, ch) {
  const p = data.products.find((x) => x.id === id);
  if (p) { p.clicks = p.clicks || {}; p.clicks[ch] = (p.clicks[ch] || 0) + 1; save(); }
}

/* ---------- เส้นทาง ---------- */
function scrollVariants(dir) {
  const row = document.getElementById('variantsRow');
  if (row) row.scrollBy({ left: dir * 160, behavior: 'smooth' });
}
function render() {
  data = load();
  const h = location.hash || '#/';
  let html;
  let m;
  if (h === '#/admin') html = pageAdmin();
  else if ((m = h.match(/^#\/p\/([^/]+)\/checkout$/))) html = pageCheckout(m[1], draft);
  else if ((m = h.match(/^#\/p\/([^/]+)\/pay$/))) html = pagePay(m[1], draft);
  else if ((m = h.match(/^#\/p\/([^/]+)\/address$/))) html = pageAddress(m[1], draft);
  else if ((m = h.match(/^#\/p\/([^/]+)$/))) html = pageProduct(m[1]);
  else if ((m = h.match(/^#\/c\/([^/]+)$/))) html = pageCategory(m[1]);
  else if ((m = h.match(/^#\/order\/(\d+)$/))) html = pageOrder(Number(m[1]));
  else if (h === '#/' || h === '') html = pageHome();
  else html = pageNotFound();
  $app().innerHTML = html;
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', render);
render();
</script>
